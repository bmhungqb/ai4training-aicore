# Config for 10s chunks (~150 frames @ 15fps) with SEQUENCE_LENGTH=150 matching 1:1
# (no frame skipping).
#
# Prepare with:
#   python tools/chunk_diff_gebd_dataset.py --chunk-seconds 10.0 --overlap-seconds 2.0 \
#       --val-overlap-seconds 0.0 --min-chunk-seconds 5.0 --train-offsets 0.0,3.0,6.0 \
#       --drop-negative-ratio 0.3
#   python tools/clean_diff_gebd_dataset.py --apply
#
# BATCH_SIZE is set to 1 for SEQUENCE_LENGTH=150 to keep VRAM usage around 7-8GB
# on 16GB VRAM GPUs (safely avoiding CUDA OOM).
DATASETS:
  TRAIN:
  - SEWING_CHUNKED_train
  TEST:
  - SEWING_CHUNKED_val
DIFFUSION:
  BETA_SCHEDULE: cosine
  CFG_PROB: 0.1
  CFG_SCALE: 7.0
  DDIM_SAMPLING_ETA: 0.0
  DETERMINISTIC: false
  SAMPLING_TIMESTEPS: 16
  SNR_SCALE: 1.0
  TIMESTEPS: 1000
  VALIDATION_TIMESTEPS:
  - 16
INPUT:
  ANNOTATORS: 1
  ANNOTATOR_SELECT: best
  ARGUMENT: true
  DOWNSAMPLE: 1
  DYNAMIC_DOWNSAMPLE: false
  END_TO_END: true
  FRAME_PER_SIDE: 5
  GAUSSIAN_TARGET: false
  GAUS_SIGMA: 0.8
  ADAPTIVE_GAUS_SIGMA: true
  GAUS_SIGMA_MIN: 0.5
  GAUS_SIGMA_MAX: 1.0
  GAUS_SIGMA_K: 12.0
  ONLY_TARGET_GAUS: true
  RESOLUTION: 224
  SEQUENCE_LENGTH: 150
MODEL:
  BACKBONE:
    FREEZE: false
    NAME: resnet50
  CLASS_DIM: 1
  DECODER: transformer
  DIMENSION: 512
  ENCODER: basicGEBD
  ENCODER_OUT: false
  FEED_FORWARD_DIM: 2048
  FPN_START_IDX: 3
  HEAD_CHOICE: 3
  NAME: DiffusionMSE_CFG
  NUM_HEADS: 8
  NUM_LAYERS: 6
  SYNC_BN: false
  WINDOW_SIZE: 17
OUTPUT_DIR: output/sewing_diffgebd_resnet50_chunk10s
SOLVER:
  AMPE: true
  BATCH_SIZE: 1
  CLIP_GRAD: 1.0
  GAMMA: 0.1
  LR: 2.0e-05
  MAX_EPOCHS: 100
  MILESTONES:
  - 2
  - 3
  MOMENTUM: 0.9
  NUM_WORKERS: 4
  OPTIMIZER: AdamW
  SCHEDULER: cosine
  WARMUP: true
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.0001
  EARLY_STOP_PATIENCE: 10
  EARLY_STOP_MIN_DELTA: 0.001
TEST:
  PRED_FILE: ''
  PROTOCOL: max
  RELDIS_THRESHOLD: 0.05
  THRESHOLD: 0.5
