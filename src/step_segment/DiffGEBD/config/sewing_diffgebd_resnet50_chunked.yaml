# Same as config/sewing_diffgebd_resnet50.yaml, but trains on the *chunked*
# Sewing dataset (see plans/plan_diff_dataloader.md) to fix the sampling
# imbalance caused by END_TO_END's np.linspace running over whole (multi-minute)
# videos instead of short clips.
#
# Prepare with:
#   python tools/prepare_diff_gebd_dataset.py
#   python tools/chunk_diff_gebd_dataset.py --chunk-seconds 12 --overlap-seconds 1.5
#
# Chunks are ~12s @ ~15fps (~150-180 frames), matching SEQUENCE_LENGTH=150 below
# so np.linspace(1, vlen, 150) is close to a 1:1 sample instead of a ~40-frame skip.
DATASETS:
  TRAIN:
  - SEWING_CHUNKED_train
  TEST:
  - SEWING_CHUNKED_val
DIFFUSION:
  BETA_SCHEDULE: cosine
  CFG_PROB: 0.1
  CFG_SCALE: 7.0
  DDIM_SAMPLING_ETA: 0.0
  DETERMINISTIC: false
  SAMPLING_TIMESTEPS: 16
  SNR_SCALE: 1.0
  TIMESTEPS: 1000
  VALIDATION_TIMESTEPS:
  - 16
INPUT:
  ANNOTATORS: 1
  ANNOTATOR_SELECT: best
  ARGUMENT: true
  DOWNSAMPLE: 1
  DYNAMIC_DOWNSAMPLE: false
  END_TO_END: true
  FRAME_PER_SIDE: 5
  GAUSSIAN_TARGET: false
  GAUS_SIGMA: 0.8
  ONLY_TARGET_GAUS: true
  RESOLUTION: 224
  SEQUENCE_LENGTH: 150
MODEL:
  BACKBONE:
    FREEZE: false
    NAME: resnet50
  CLASS_DIM: 1
  DECODER: transformer
  DIMENSION: 512
  ENCODER: basicGEBD
  ENCODER_OUT: false
  FEED_FORWARD_DIM: 2048
  FPN_START_IDX: 3
  HEAD_CHOICE: 3
  NAME: DiffusionMSE_CFG
  NUM_HEADS: 8
  NUM_LAYERS: 6
  SYNC_BN: false
  WINDOW_SIZE: 17
OUTPUT_DIR: output/sewing_diffgebd_resnet50_chunked
SOLVER:
  AMPE: true
  BATCH_SIZE: 1
  CLIP_GRAD: 0.0
  GAMMA: 0.1
  LR: 2.0e-05
  MAX_EPOCHS: 100
  MILESTONES:
  - 2
  - 3
  MOMENTUM: 0.9
  NUM_WORKERS: 4
  OPTIMIZER: AdamW
  SCHEDULER: cosine
  WARMUP: true
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.0001
TEST:
  PRED_FILE: ''
  PROTOCOL: max
  RELDIS_THRESHOLD: 0.05
  THRESHOLD: 0.5
