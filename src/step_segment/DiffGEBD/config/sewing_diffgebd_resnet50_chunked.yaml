# Same as config/sewing_diffgebd_resnet50.yaml, but trains on the *chunked*
# Sewing dataset (see docs/step_segment/diff_gebd.md) to fix the sampling
# imbalance caused by END_TO_END's np.linspace running over whole (multi-minute)
# videos instead of short clips.
#
# Prepare with:
#   python tools/prepare_diff_gebd_dataset.py
#   python tools/chunk_diff_gebd_dataset.py --chunk-seconds 12 --overlap-seconds 1.5
#
# Chunks are ~12s @ ~15fps (~150-180 frames), matching SEQUENCE_LENGTH=150 below
# so np.linspace(1, vlen, 150) is close to a 1:1 sample instead of a ~40-frame skip.
#
# Training-process tuning (see docs/step_segment/diff_gebd.md follow-up):
#  - MODEL.POS_LOSS_WEIGHT=5.0: up-weights the MSE loss near boundary frames,
#    which are still a small minority of each chunk -> directly targets recall.
#  - INPUT.GAUS_SIGMA=1.5 (was 0.8): widens the positive-target bump so more
#    frames around each boundary get meaningful gradient signal.
#  - SOLVER.ACCUM_STEPS=8 (effective batch=8) + CLIP_GRAD=1.0: BATCH_SIZE=1 is
#    very noisy for this regression loss; gradient accumulation + clipping
#    stabilizes optimization.
#  - DIFFUSION.VAL_SEED (default 42 in modeling/config.py) fixes the DDIM
#    reverse-diffusion starting noise during validation, so epoch-to-epoch
#    metrics reflect real model changes instead of sampling RNG.
#  - SOLVER.EMA_DECAY=0.999: validate/checkpoint on an EMA of the weights
#    (standard for diffusion models) instead of the raw, noisy end-of-step
#    weights.
#  - MODEL.DROPOUT=0.2 (was hardcoded 0.1): a bit more regularization for the
#    transformer decoder given the small (~25-video) dataset.
#  - MODEL.BACKBONE.NAME can now be any torchvision ResNet-family model
#    (resnet18/34/50/101/152, resnext50_32x4d, wide_resnet50_2, ...); kept at
#    resnet50 here, but resnet34 is worth trying to reduce overfitting risk.

DATASETS:
  TRAIN:
  - SEWING_CHUNKED_train
  TEST:
  - SEWING_CHUNKED_val
DIFFUSION:
  BETA_SCHEDULE: cosine
  CFG_PROB: 0.1
  CFG_SCALE: 7.0
  DDIM_SAMPLING_ETA: 0.0
  DETERMINISTIC: false
  SAMPLING_TIMESTEPS: 16
  SNR_SCALE: 1.0
  TIMESTEPS: 1000
  VALIDATION_TIMESTEPS:
  - 16
INPUT:
  ANNOTATORS: 1
  ANNOTATOR_SELECT: best
  ARGUMENT: true
  DOWNSAMPLE: 1
  DYNAMIC_DOWNSAMPLE: false
  END_TO_END: true
  FRAME_PER_SIDE: 5
  GAUSSIAN_TARGET: false
  GAUS_SIGMA: 1.5
  ONLY_TARGET_GAUS: true
  RESOLUTION: 224
  SEQUENCE_LENGTH: 150
MODEL:
  BACKBONE:
    FREEZE: false
    NAME: resnet50
  CLASS_DIM: 1
  DECODER: transformer
  DIMENSION: 512
  ENCODER: basicGEBD
  ENCODER_OUT: false
  FEED_FORWARD_DIM: 2048
  FPN_START_IDX: 3
  HEAD_CHOICE: 3
  NAME: DiffusionMSE_CFG
  DROPOUT: 0.2
  NUM_HEADS: 8
  NUM_LAYERS: 6
  POS_LOSS_WEIGHT: 5.0
  SYNC_BN: false
  WINDOW_SIZE: 17
OUTPUT_DIR: output/sewing_diffgebd_resnet50_chunked
SOLVER:
  ACCUM_STEPS: 8
  AMPE: true
  BATCH_SIZE: 1
  CLIP_GRAD: 1.0
  EMA_DECAY: 0.999
  GAMMA: 0.1
  LR: 2.0e-05
  MAX_EPOCHS: 100
  MILESTONES:
  - 2
  - 3
  MOMENTUM: 0.9
  NUM_WORKERS: 4
  OPTIMIZER: AdamW
  SCHEDULER: cosine
  WARMUP: true
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.0001
TEST:
  PRED_FILE: ''
  PROTOCOL: max
  RELDIS_THRESHOLD: 0.05
  THRESHOLD: 0.5
