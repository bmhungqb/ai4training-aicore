# DiffGEBD config for the industrial sewing "Step Segmentation" dataset.
#
# Dataset must be prepared first with:
#   python tools/prepare_diff_gebd_dataset.py
# which produces data/diff_gebd_dataset/{images,train_annotation.pkl,val_annotation.pkl}
#
# Mirrors upstream config/config.yaml (ResNet-50 backbone, DiffFormer/Transformer
# diffusion head, Classifier-Free Guidance) but targets the SEWING dataset and a
# batch/epoch schedule suited to ~33 videos on 1-2 GPUs.
DATASETS:
  TRAIN:
  - SEWING_train
  TEST:
  - SEWING_val
DIFFUSION:
  BETA_SCHEDULE: cosine
  CFG_PROB: 0.1
  CFG_SCALE: 7.0
  DDIM_SAMPLING_ETA: 0.0
  DETERMINISTIC: false
  SAMPLING_TIMESTEPS: 16
  SNR_SCALE: 1.0
  TIMESTEPS: 1000
  VALIDATION_TIMESTEPS:
  - 16
INPUT:
  ANNOTATORS: 1              # single annotator (our step_segments.json has one GT source)
  ANNOTATOR_SELECT: best
  ARGUMENT: true
  DOWNSAMPLE: 1
  DYNAMIC_DOWNSAMPLE: false
  END_TO_END: true
  FRAME_PER_SIDE: 5
  GAUSSIAN_TARGET: false
  GAUS_SIGMA: 0.5
  ONLY_TARGET_GAUS: true
  RESOLUTION: 224
  SEQUENCE_LENGTH: 150
MODEL:
  BACKBONE:
    FREEZE: true
    NAME: resnet50
  CLASS_DIM: 1
  DECODER: transformer
  DIMENSION: 512
  ENCODER: basicGEBD
  ENCODER_OUT: false
  FEED_FORWARD_DIM: 2048
  FPN_START_IDX: 3
  HEAD_CHOICE: 3
  NAME: DiffusionMSE_CFG
  NUM_HEADS: 8
  NUM_LAYERS: 6
  # SyncBatchNorm requires an initialized torch.distributed process group; keep
  # disabled here since single-GPU (torchrun --nproc_per_node=1) never calls
  # init_process_group. Re-enable if training multi-GPU DDP.
  SYNC_BN: false
  WINDOW_SIZE: 17
OUTPUT_DIR: output/sewing_diffgebd_resnet50
SOLVER:
  AMPE: true
  BATCH_SIZE: 1
  CLIP_GRAD: 0.0
  GAMMA: 0.1
  LR: 2.0e-05
  MAX_EPOCHS: 100
  MILESTONES:
  - 2
  - 3
  MOMENTUM: 0.9
  NUM_WORKERS: 4
  OPTIMIZER: AdamW
  SCHEDULER: cosine
  WARMUP: true
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.0001
TEST:
  PRED_FILE: ''
  PROTOCOL: max
  RELDIS_THRESHOLD: 0.05
  THRESHOLD: 0.5
