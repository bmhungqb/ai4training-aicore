######################################################################################################
# DDM-Net training config for the sewing "step segmentation" dataset.
# Paths are relative to the repository root (ai4training-aicore-poc/).
# Generate train/val annotations first with:
#   python tools/process_step_segments.py
#   python tools/prepare_ddm_dataset.py --split-mode random --val-ratio 0.2 --seed 42
######################################################################################################

dataset_config:
  dataset: "DDMDataset"
  resolution: 518
  frames_per_side: 8
  downsample: 2
  min_change_dur: 0.4
  num_classes: 2
  seed: 42
  video_backend: "pyav"
  use_mask_roi: true
  mask_margin: 0.05

  train_config:
    mode: "train"
    anno_path: data/ddm_dataset/train_annotation.json
    data_root: data/ddm_dataset/videos
    augmentation:
      RandomResize:
        enabled: true
        interpolation: [bilinear, bicubic, nearest]
        antialias_prob: 0.5
      ColorJitter:
        enabled: true
        brightness: 0.25
        contrast: 0.3
        saturation: 0.15
        hue: 0.02
      GaussianBlur:
        enabled: true
        apply_prob: 0.5
        kernel_size: 3
        sigma: [0.1, 0.5]

  val_config:
    mode: "val"
    anno_path: data/ddm_dataset/val_annotation.json
    data_root: data/ddm_dataset/videos
    temporal_stride: 1
    # --- RAM-growth mitigation (see issues/step_segment_validating_issues.md) ---
    # Validation streams every frame of every val video (dense, temporal_stride=1),
    # unlike training's sparse sampling, so it needs its own, more conservative
    # worker/reader settings to avoid System RAM OOM.
    workers: 1               # fewer processes -> fewer duplicated decord buffers
    chunk_duration: 60.0     # seconds; forces periodic reader re-creation/release
    decord_num_threads: 1    # caps decord's internal native read-ahead cache
    gc_every_n_clips: 1      # force a GC pass after every clip is released

  batch_size: 4
  workers: 2

# ============================================================================
# Model Configuration
# ============================================================================
model_config:
  model_name: "multiframes_resnet"
  backbone: "dinov2_vitb14"       # Meta Torch Hub DINOv2 ViT-B/14 (86M params, embed_dim=768)
                                   # Optimal balance of high representation power and fast training.
                                   # Alternatives: dinov2_vits14 (21M params), dinov2_vitl14 (304M params)
  pretrained: true                # Automatically downloads weights via torch.hub from Meta
  freeze_backbone: true           # Keep backbone frozen for efficient fine-tuning on 16GB VRAM
  num_classes: 2
  img_size: 518

# ============================================================================
# Training Configuration
# ============================================================================
training_config:
  optimizer: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.0001
  momentum: 0.9
  opt_eps: null
  opt_betas: null

  scheduler: "cosine"
  warmup_epochs: 1
  warmup_lr: 0.00001
  decay_epochs: 5
  decay_rate: 0.5
  min_lr: 1e-10
  patience_epochs: 10

  epochs: 30
  eval_freq: 1
  seed: 42

  clip_grad: null
  clip_mode: "norm"

  amp: true   # mixed precision - needed to keep ViT-L/518 activations within 16GB

  model_ema: true
  model_ema_decay: 0.999
  model_ema_start_epoch: 10

  eval_metric: "f1_score"
  save_visualizations: true
  log_interval: 50

  output: "./output_lightning"
  exp_name: "step_segment_ddm_net"
  resume: null
  checkpoint_top_k: 3

  num_gpus: 1
  num_nodes: 1
  strategy: "auto"
