# EfficientGEBD config for sewing Step Segmentation with torchvision ResNet50 backbone.
# No mmcv / mmaction2 / CSN-pretrained weights needed.
#
# Dataset must be prepared first with:
#   python tools/prepare_efficient_gebd_dataset.py
# which produces data/efficient_gebd_dataset/{images,train_annotation.pkl,val_annotation.pkl}

MODEL:
  NAME: 'E2EModelDiff'
  BACKBONE:
    NAME: 'resnet50'       # torchvision pretrained resnet50
  DIMENSION: 512
  WINDOW_SIZE: 8
  K: 8
  NUM_TSLICE: 10
  SIMILARITY_GROUP: 4
  SIMILARITY_FUNC: 'cosine'
  HEAD_CHOICE: [1]          # x2 head
  LOSS_WEIGHT: [1]
  NUM_BLOCKS: 3
  RESNET_TYPE: 1
  CAT_PREV: True
  FPN_START_IDX: 0
  IS_BASIC: False
  SYNC_BN: False

DATASETS:
  TRAIN: ('SEWING_train',)
  TEST: ('SEWING_val',)

INPUT:
  RESOLUTION: 224
  ARGUMENT: True
  ANNOTATORS: 1            # single annotator (our step_segments.json has one GT source)
  END_TO_END: True
  SEQUENCE_LENGTH: 100      # frames per 10s slice (slice-based sampling, TAPOS-style)
  FRAME_MASK: True

SOLVER:
  MAX_EPOCHS: 150
  WARMUP_EPOCHS: 5
  MILESTONES: [80, 120]
  GAMMA: 0.1
  BATCH_SIZE: 2
  AMPE: False
  LR: 1e-4
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  CLIP_GRAD: 1.0
  NUM_WORKERS: 2
  OPTIMIZER: 'AdamW'
  SIGMA: 2          # widen the positive target window around each boundary (was hard-coded to 1, disconnected from this config) to give the model more room to learn -> helps recall
  POS_WEIGHT: 4.5    # counter class imbalance (only ~18% of frames are near a boundary)

TEST:
  THRESHOLD: 0.2    # lower from 0.3: precision was near 1.0 / recall near 0, i.e. model was too conservative
  DYNAMIC: False
  THH: [0.35, 0.35, 0.35]
  THL: [0.0, 0.0, 0.0]
  IGNORE: 5
  PAD_IGNORE: 2
  RELDIS_THRESHOLD: 0.05

OUTPUT_DIR: 'output/sewing/resnet50/'
