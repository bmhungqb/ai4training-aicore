experiment_id: exp_001_efficientgebd_baseline
track: step_segment
iteration_id: iter_01
model_type: efficient_gebd  # Options: efficient_gebd | diff_gebd | ddm_net

description: "Baseline benchmark of EfficientGEBD on Chuyền 1 sewing step segmentation"

# Model specific configurations
model_params:
  backbone: resnet50
  sequence_length: 100

# Training parameters (when mode: train)
training_params:
  epochs: 50
  learning_rate: 0.0001
  pos_weight: 4.5
  batch_size: 2

# Evaluation & inference setup
eval_params:
  primary_window: 0.5
  tolerance_windows: [0.25, 0.5, 1.0]
  data_dir: "data"

# Optional path overrides
efficientgebd_config_file: "src/step_segment/EfficientGEBD/config-files/sewing_resnet50.yaml"
# diffgebd_config_file: "src/step_segment/DiffGEBD/config/sewing_diffgebd_resnet50_chunked.yaml"
# checkpoint: "path/to/checkpoint.pth"
