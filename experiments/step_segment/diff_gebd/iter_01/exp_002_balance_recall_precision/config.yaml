experiment_id: exp_002_balance_recall_precision
track: step_segment
iteration_id: iter_01
model_type: diff_gebd

description: "DiffGEBD (ResNet-50) with reduced GAUS_SIGMA (narrower positive-target bump) and plain (unweighted) MSE loss to trade some recall back for precision vs exp_001_baseline"

model_params:
  backbone: resnet50
  sequence_length: 150
  cfg_scale: 7.0

training_params:
  epochs: 100
  learning_rate: 0.00002
  # exp_001_baseline used gaus_sigma=1.5, which widened the positive-target
  # gaussian bump to fix a recall=0.19 sampling-imbalance bug, and (in an
  # earlier revision of this repo) also up-weighted the MSE loss near
  # boundary frames via MODEL.POS_LOSS_WEIGHT. That combination overcorrected
  # towards recall. The POS_LOSS_WEIGHT weighting has since been reverted
  # (back to the method's original, unweighted MSE loss); this experiment
  # narrows gaus_sigma back down, which alone should recover some precision
  # without re-introducing the original near-zero recall.
  gaus_sigma: 0.8
  accum_steps: 8

eval_params:
  primary_window: 0.5
  tolerance_windows: [0.25, 0.5, 1.0]

diffgebd_config_file: "src/step_segment/DiffGEBD/config/sewing_diffgebd_resnet50_chunked.yaml"
